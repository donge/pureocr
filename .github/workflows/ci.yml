name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: make test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: docker/setup-qemu-action@v3
      - name: Build linux/amd64 and linux/arm64
        run: make image GOPROXY=https://proxy.golang.org,direct
      - uses: actions/upload-artifact@v4
        with:
          name: pureocr-linux
          path: bin/
